; Weapon Station Ammo server configuration
; Copy this file to the UT2004 System directory.
; The mutator loads it automatically when instantiated.

[WeaponStationAmmo.MutWeaponStationAmmo]
PerPawnCooldown=30.000000

; Initial ammo on first weapon pickup (native ammo InitialAmount):
; Map weapon pickup actors do not define AmmoAmount, so the weapon's normal
; GiveTo/GiveAmmo logic supplies these initial amounts.
; Weapon                         Primary  Secondary
; Assault Rifle                  100      4 (GrenadeAmmo)
; Bio Rifle                      20       20
; Shock Rifle                    20       20
; Link Gun                       70       70
; Minigun                        150      150
; Flak Cannon                    15       15
; Rocket Launcher                12       12
; Lightning Gun                  15       15
; AVRiL                          5        5
; ONS Grenade Launcher           10       10
; ONS Mine Layer                 4        4
; Classic Sniper Rifle           15       15
;
; Default ammo give on repeat pickup:
; These values are the native ammo pickup amounts used when a player already
; owns the weapon. Change them to tune each weapon station independently.
; Assault Rifle: 4
; Bio Rifle: 20
; Shock Rifle: 10
; Link Gun: 50
; Minigun: 50
; Flak Cannon: 10
; Rocket Launcher: 9
; Lightning Gun: 10
; AVRiL: 5
; ONS Grenade Launcher: 5
; ONS Mine Layer: 8
; Classic Sniper Rifle: 10

AssaultRifleSecondaryAmmo=4
BioRifleSecondaryAmmo=20
ShockRifleSecondaryAmmo=10
LinkGunSecondaryAmmo=50
MinigunSecondaryAmmo=50
FlakCannonSecondaryAmmo=10
RocketLauncherSecondaryAmmo=9
LightningGunSecondaryAmmo=10
AvrilSecondaryAmmo=5
ONSGrenadeLauncherSecondaryAmmo=5
ONSMineLayerSecondaryAmmo=8
ClassicSniperRifleSecondaryAmmo=10
